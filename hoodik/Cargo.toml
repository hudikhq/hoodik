[package]
name = "hoodik"
version = "2.5.1"
edition = "2021"
rust-version = "1.91"
authors = ["Tibor Hudik <hello@hudik.eu>"]
readme = "../README.md"
license-file = "../LICENSE.md"
description = "Hoodik is a simple, fast and end to end encrypted cloud storage."
default-run = "hoodik"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Which app builds this server works with, published on `/api/liveness` so the
# app can say "update me" or "update your server" itself instead of failing in
# a way the user cannot interpret.
#
# Kept here rather than in source because it is release metadata: it belongs
# next to the version it ships with, and that is the one number a release
# already has to touch. `build.rs` lifts both into the binary.
[package.metadata.compat]
# Below this an app is refused outright — 2.5.0 keyed the search index, and an
# older app can only produce digests this server no longer stores.
minimum_client_version = "2.5.0"
# Below this everything still works; the app only nudges. Raising this is
# cheap, raising the minimum breaks people, which is why they are separate.
recommended_client_version = "2.5.0"

[dependencies]
openssl = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
actix-web = { workspace = true, features = ["rustls"] }
actix-cors = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
glob = { workspace = true }

admin = { path = "../admin" }
auth = { path = "../auth" }
config = { path = "../config" }
context = { path = "../context" }
cryptfns = { path = "../cryptfns" }
entity = { path = "../entity" }
error = { path = "../error" }
fs = { path = "../fs", features = ["s3"] }
links = { path = "../links" }
migration = { path = "../migration" }
shares = { path = "../shares" }
storage = { path = "../storage" }

# Only compiled for the `e2e-seed` legacy-account seeder (see [[bin]] below);
# a normal build pulls in neither.
sea-orm = { workspace = true, optional = true }
util = { path = "../util", optional = true }

[features]
# Builds the dev-only `seed_legacy` binary. Never enabled by a release build.
e2e-seed = ["dep:sea-orm", "dep:util"]

# Legacy-account seeder for the browser migration test. Feature-gated so
# `cargo build --release` never emits it — a public repo must not ship a tool
# that mints RSA + bcrypt accounts.
[[bin]]
name = "seed_legacy"
path = "src/seed_legacy.rs"
required-features = ["e2e-seed"]

[dev-dependencies]
actix-http = "3"
chrono = { workspace = true }
rand = "^0.8"
sha2 = "0.10"
auth = { path = "../auth", features = ["mock"] }
context = { path = "../context", features = ["mock"] }
cryptfns = { path = "../cryptfns", features = ["mock"] }
email = { path = "../email", features = ["mock"] }
links = { path = "../links", features = ["mock"] }
shares = { path = "../shares", features = ["mock", "test-support"] }
storage = { path = "../storage", features = ["mock"] }
settings = { path = "../settings", features = ["mock"] }
transfer = { path = "../transfer" }
util = { path = "../util" }

# Configuration for metadata of the deb package
[package.metadata.deb]
maintainer-scripts = "package/deb"
# This will be generated during the packaging process
changelog = "changelog"
assets = [
    [
      "target/release/hoodik",
      "/usr/bin/hoodik",
      "0755"
    ],
    [
        "../.env.example",
        "/usr/share/hoodik/hoodik.conf",
        "644",
    ],
]
systemd-units = { unit-name = "hoodik", unit-scripts = "../package/common", enable = true }

# Variant of the Debian packaging configuration that:
#   a) statically links with OpenSSL when building a Debian package because the
#      newest OpenSSL available on Ubuntu 16.04 at the time of writing is 1.0.2g
#      (see: https://packages.ubuntu.com/xenial/openssl) while Krill requires
#      OpenSSL >= 1.1.0.
#   b) uses a simpler systemd service unit file because Ubuntu 16.04 doesn't
#      support newer features supported by Ubuntu 18.04 and 20.04.
[package.metadata.deb.variants.ubuntu-focal]

[package.metadata.deb.variants.ubuntu-jammy]

[package.metadata.deb.variants.debian-bullseye]

[package.metadata.deb.variants.debian-bookworm]

# Cross compilation variants:
# Note: we have to specifiy dependencies manually because we don't run cargo-deb
# on the target platform and so it cannot determine the dependencies correctly
# for us.

[package.metadata.deb.variants.debian-buster-aarch64-unknown-linux-gnu]
depends = "adduser, passwd, libc6 (>= 2.28)"

[package.metadata.deb.variants.debian-buster-arm-unknown-linux-gnueabihf]
depends = "adduser, passwd, libc6 (>= 2.28)"

[package.metadata.deb.variants.debian-bullseye-armv7-unknown-linux-gnueabihf]
depends = "adduser, passwd, libc6 (>= 2.28)"

[build-dependencies]
# Build-only: reads the compat table above so it lives in one place.
toml = "^0.8"
