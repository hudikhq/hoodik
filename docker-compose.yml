---
version: "2"

services:
  postgres:
    image: bitnami/postgresql:latest
    restart: always
    hostname: postgres
    container_name: postgres
    environment:
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres
      - POSTGRESQL_DATABASE=postgres
      - POSTGRESQL_WAL_LEVEL=logical
    ports:
      - "5432:5432"

  # Ephemeral Postgres for the Rust integration suite.
  # `tmpfs` keeps the data dir in RAM so the container starts in ~1s and
  # leaves no state behind between runs. Port 5433 avoids colliding with a
  # developer's local Postgres on 5432.
  postgres-test:
    image: postgres:16-alpine
    hostname: postgres-test
    container_name: postgres-test
    environment:
      POSTGRES_USER: hoodik_test
      POSTGRES_PASSWORD: hoodik_test
      POSTGRES_DB: hoodik_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoodik_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      # 4 GB is enough headroom for one full test suite run; each per-test
      # database is ~10 MB after migrations and the harness leaves them
      # behind until the container is recreated.
      - /var/lib/postgresql/data:size=4g

  minio:
    image: versity/versitygw:v1.9.0@sha256:eb7f786fcd91e72194e48fcf1ac16302d686bf8e3a71434bdbc067a6efd3fdc7
    hostname: minio
    container_name: minio
    environment:
      - ROOT_ACCESS_KEY=minioadmin
      - ROOT_SECRET_KEY=minioadmin
      - VGW_PORT=:9000
      - VGW_BACKEND=posix
      - VGW_BACKEND_ARG=/data
    ports:
      - "9000:9000"
    volumes:
      # A named volume, not a bind mount: the daemon creates a host bind as
      # root, and one under data/ leaves the whole directory root-owned, so
      # the e2e recipe could no longer mkdir its own data/e2e beside it.
      - minio:/data

  # Creates the default bucket and its browser CORS rule on first startup
  minio-init:
    image: amazon/aws-cli:2.38.3@sha256:efe32e825cf203652eaca3e7e94679580274e7d567c39270aaa36a5144737108
    depends_on:
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        s3="aws --endpoint-url http://minio:9000 s3api"
        for i in $$(seq 1 30); do $$s3 head-bucket --bucket hoodik 2>/dev/null && break; $$s3 create-bucket --bucket hoodik >/dev/null && break; sleep 1; done
        $$s3 put-bucket-cors --bucket hoodik --cors-configuration '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}'
        echo 'Bucket ready.'

volumes:
  minio:
