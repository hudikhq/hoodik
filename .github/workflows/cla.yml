name: Contributor License Agreement

# Asks first-time contributors to sign CLA.md before their pull request can be
# merged. Signatures are stored in signatures/cla.json in this repository, so
# no third-party service holds contributor data.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or request signature
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/hudikhq/hoodik/blob/master/CLA.md
          branch: master
          allowlist: htunlogic,dependabot[bot]
